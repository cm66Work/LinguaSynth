# Compose files for typesense server
services:
  typesense:
    image: typesense/typesense:29.0
    container_name: "typesense_server"
    restart: on-failure
    ports:
      - "8108:${TYPESENSE_PORT}"
    volumes:
      - ./data:/data
    environment:
      TYPESENSE_API_KEY: /run/secrets/typesense_api_key
      TYPESENSE_SEARCH_API_KEY: /run/secrets/typesense_search_api_key
      TYPESENSE_DATA_DIR: /data
    command: '--enable-cors'
    depends_on:
      - ollama
    secrets:
      - typesense_api_key
      - typesense_search_api_key
