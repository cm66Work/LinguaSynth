# Root compose file for services.
include:
  - ./Ollama/docker-compose.yml
  - ./Typesense/docker-compose.yml
  - ./Postgres/docker-compose.yml
  - ./MinIO/docker-compose.yml
  - ./LinguaSynth/docker-compose.yml

secrets:
  # Typesense
  typesense_api_key:
    file: ${SECRETS_PATH}/Typesense/typesense_api_key.txt
  typesense_search_api_key:
    file: ${SECRETS_PATH}/Typesense/typesense_search_api_key.txt
  # Postgres
  postgres_username:
    file: ${SECRETS_PATH}/Postgres/postgres_username.txt
  postgres_password:
    file: ${SECRETS_PATH}/Postgres/postgres_password.txt
  # MinIO
  minio_root_username:
    file: ${SECRETS_PATH}/MinIO/minio_root_username.txt
  minio_root_password:
    file: ${SECRETS_PATH}/MinIO/minio_root_password.txt
