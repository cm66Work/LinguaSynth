services:
  typesense:
    image: typesense/typesense:29.0
    container_name: "typesense_server"
    restart: on-failure
    ports:
      - "8108:8108"
    volumes:
      - ./Typesense/data:/data
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
    command: '--enable-cors'
  ollama:
    image: ollama/ollama:0.11.8
    container_name: "ollama_server"
    restart: on-failure
    ports:
      - "11434:11434"
    volumes:
      - ./Ollama/data:/root/.ollama
